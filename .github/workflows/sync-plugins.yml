# Safety net: re-derives every registered plugin's entry from its own manifest.
#
# Each installable plugin also pushes its entry on merge to dev (see
# publish-registry.yml in the plugin repos), which is the timely path. That
# path needs a cross-repo token. This one needs nothing: every source repo is
# public, so the manifests are readable over raw.githubusercontent.com and the
# commit goes back with the built-in GITHUB_TOKEN.
#
# So the two mechanisms are deliberately not redundant:
#   push  -> immediate, needs a credential
#   pull  -> hourly, needs none, and covers the built-in plugins that have no
#            repo of their own to push from
#
# The pull runs hourly because it is the bound on how stale the store can get
# when the push path silently stops working — a token expires, a workflow
# breaks, a new plugin is listed here before its secret is set.
# upsert_plugin.py is idempotent, so whichever runs second is a no-op.
#
# Add a plugin to sources.json and its version tracks automatically.
#
# ## Every source repo must be PUBLIC
#
# This path reads manifests over raw.githubusercontent.com with no credential,
# so a private source repo cannot be synced here at all — raw returns 404 and
# there is nothing to fall back on. That is a hard requirement of listing a
# plugin in sources.json, not a preference. A private plugin has only the push
# path, and so must set REGISTRY_PUBLISH_TOKEN or go unlisted.
#
# ## One bad source must not freeze the others
#
# It used to. The loop ran under `set -e` and aborted on the first curl
# failure, before the commit step — so a single unreachable manifest discarded
# every other plugin's already-computed update and committed nothing. Observed
# live on 2026-08-10: a private repo was added to sources.json at 12:30Z and
# the 13:41Z run was the first red after a day of green, with all four healthy
# plugins silently not tracking.
#
# The failure is still loud — error annotations naming each broken source, and
# a red job. What changed is that the healthy entries are committed first, so
# the blast radius of one broken source is that source alone.
name: Sync plugins from source manifests

on:
  schedule:
    # Hourly, not weekly. This interval is the WORST-CASE staleness of the
    # whole marketplace, because it is what remains when the push path does not
    # fire — an expired REGISTRY_PUBLISH_TOKEN, a broken workflow in a plugin
    # repo, or a plugin listed here that has no token at all. Weekly meant any
    # of those could hide a version bump for seven days.
    #
    # It costs nothing to run this often: the registry is public, so Actions
    # minutes are free, and the job makes no commit when every entry is already
    # current — which is the normal outcome once the push path is working.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Re-derive entries from manifests
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install jsonschema

      - name: Upsert every source in sources.json
        id: upsert
        run: |
          set -euo pipefail
          count="$(python3 -c "import json;print(len(json.load(open('sources.json'))['sources']))")"
          failed=""
          for i in $(seq 0 $((count - 1))); do
            read -r name repo manifest <<<"$(python3 -c "
          import json
          s = json.load(open('sources.json'))['sources'][$i]
          print(s['name'], s['repo'], s['manifest'])
          ")"
            tag_args="$(python3 -c "
          import json
          s = json.load(open('sources.json'))['sources'][$i]
          print(' '.join('--tag ' + t for t in s.get('tags', [])))
          ")"
            echo "::group::$name"
            # -f so a moved, renamed or unreadable manifest is an error and not
            # a silent skip — silently skipping is how the registry went stale
            # in the first place. Wrapped in `if` rather than left bare so the
            # remaining sources still run and still get committed; `set -e`
            # does not fire on a command in an if-condition.
            # shellcheck disable=SC2086
            if curl -fsSL "$manifest" -o manifest.json \
              && python3 scripts/upsert_plugin.py --manifest manifest.json --repo "$repo" $tag_args; then
              :
            else
              echo "::error title=Registry sync failed for ${name}::Could not re-derive '${name}' from ${manifest}. If its repo is private, raw.githubusercontent.com returns 404 and this credential-free sync can never work for it — every repo listed in sources.json must be public, or the plugin must rely on the push path and set REGISTRY_PUBLISH_TOKEN."
              failed="${failed} ${name}"
            fi
            rm -f manifest.json
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      # always(), because the whole point is that a broken source does not stop
      # the healthy ones from being published. The job still goes red, in the
      # step after this one.
      - name: Commit any change
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins.json; then
            echo "All entries already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "chore(registry): sync plugin versions from source manifests"
          git push

      # Last, so the healthy entries are already committed when this reds the
      # run. A source listed here that cannot be read is a real defect — either
      # its manifest moved, or its repo is private and was never syncable.
      - name: Fail if any source could not be synced
        if: always() && steps.upsert.outputs.failed != ''
        run: |
          echo "Could not sync: ${{ steps.upsert.outputs.failed }}"
          echo "Any other plugin's changes were still committed — see the step above."
          exit 1
