# Safety net: re-derives every registered plugin's entry from its own manifest.
#
# Each installable plugin also pushes its entry on merge to dev (see
# publish-registry.yml in the plugin repos), which is the timely path. That
# path needs a cross-repo token. This one needs nothing: every source repo is
# public, so the manifests are readable over raw.githubusercontent.com and the
# commit goes back with the built-in GITHUB_TOKEN.
#
# So the two mechanisms are deliberately not redundant:
#   push  -> immediate, needs a credential
#   pull  -> hourly, needs none, and covers the built-in plugins that have no
#            repo of their own to push from
#
# The pull runs hourly because it is the bound on how stale the store can get
# when the push path silently stops working — a token expires, a workflow
# breaks, a new plugin is listed here before its secret is set.
# upsert_plugin.py is idempotent, so whichever runs second is a no-op.
#
# Add a plugin to sources.json and its version tracks automatically.
name: Sync plugins from source manifests

on:
  schedule:
    # Hourly, not weekly. This interval is the WORST-CASE staleness of the
    # whole marketplace, because it is what remains when the push path does not
    # fire — an expired REGISTRY_PUBLISH_TOKEN, a broken workflow in a plugin
    # repo, or a plugin listed here that has no token at all. Weekly meant any
    # of those could hide a version bump for seven days.
    #
    # It costs nothing to run this often: the registry is public, so Actions
    # minutes are free, and the job makes no commit when every entry is already
    # current — which is the normal outcome once the push path is working.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Re-derive entries from manifests
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install jsonschema

      - name: Upsert every source in sources.json
        run: |
          set -euo pipefail
          count="$(python3 -c "import json;print(len(json.load(open('sources.json'))['sources']))")"
          for i in $(seq 0 $((count - 1))); do
            read -r name repo manifest <<<"$(python3 -c "
          import json
          s = json.load(open('sources.json'))['sources'][$i]
          print(s['name'], s['repo'], s['manifest'])
          ")"
            tag_args="$(python3 -c "
          import json
          s = json.load(open('sources.json'))['sources'][$i]
          print(' '.join('--tag ' + t for t in s.get('tags', [])))
          ")"
            echo "::group::$name"
            # -f so a moved or renamed manifest fails the job. Silently
            # skipping is how the registry went stale in the first place.
            curl -fsSL "$manifest" -o "manifest.json"
            # shellcheck disable=SC2086
            python3 scripts/upsert_plugin.py --manifest manifest.json --repo "$repo" $tag_args
            rm -f manifest.json
            echo "::endgroup::"
          done

      - name: Commit any change
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins.json; then
            echo "All entries already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "chore(registry): sync plugin versions from source manifests"
          git push
